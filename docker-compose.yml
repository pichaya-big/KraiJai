services:
  db:
    image: postgres:16-alpine
    container_name: kraijai-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-kraijai_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SuperSecretPassword123!}
      POSTGRES_DB: ${DB_NAME:-kraijai_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kraijai-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kraijai-server
    restart: always
    depends_on:
      - db
    networks:
      - kraijai-net
      - nginx-proxy-net
    # nginx-proxy integration
    # (Environment variables read by nginx-proxy to configure routing and SSL certificates)
    expose:
      - 5000
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kraijai_admin}:${DB_PASSWORD:-SuperSecretPassword123!}@db:5432/${DB_NAME:-kraijai_db}?schema=public
      PORT: 5000
      NODE_ENV: production
      LOG_LEVEL: info
      CORS_ORIGIN: https://${DOMAIN:-kraijai.local}
      VIRTUAL_HOST: api.${DOMAIN:-kraijai.local}
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: api.${DOMAIN:-kraijai.local}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@kraijai.local}


  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kraijai-client
    restart: always
    depends_on:
      - server
    networks:
      - nginx-proxy-net
    # nginx-proxy integration
    expose:
      - 3000
    environment:
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-kraijai.local}
      VIRTUAL_HOST: ${DOMAIN:-kraijai.local}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${DOMAIN:-kraijai.local}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@kraijai.local}

volumes:
  pgdata:

networks:
  kraijai-net:
    driver: bridge
  nginx-proxy-net:
    external: true
